<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Дизайн-выходные 2026. Тула</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="masthead">
        <div class="brand">
          <h1>
            <span class="title-full">Дизайн-выходные</span>
            <span class="title-short">ДВ'26</span>
          </h1>
          <p class="place">Тула · 9–10 октября 2026</p>
        </div>
        <div class="mast-tools">
          <button type="button" class="mode" id="favorites" aria-pressed="false" aria-label="Включение — Выключение избранного">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.2 14.6 8.6l5.9.7-4.4 4 1.2 5.8L12 16.3 6.7 19.1l1.2-5.8-4.4-4 5.9-.7Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
            </svg>
          </button>
          <button type="button" class="mode" id="mode" aria-pressed="false" aria-label="Группировка по часам">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" fill="none" stroke="currentColor" stroke-width="1.75" />
              <path d="M12 8.25V12.1l2.6 1.7" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <div class="days" id="days" role="tablist" aria-label="День"></div>
        </div>
      </div>
      <div class="halls" id="halls" role="tablist" aria-label="Залы"></div>
      <p class="section" id="section"></p>
    </header>

    <div class="board" id="board" tabindex="0" aria-label="Расписание."></div>

    <footer class="site-footer">
      <a href="https://t.me/K_u_z_i_n" target="_blank" rel="noopener noreferrer">Добавить ссылку — https://t.me/K_u_z_i_n</a>
    </footer>

    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet">
        <p class="sheet-meta" id="sheet-meta"></p>
        <p class="sheet-kind" id="sheet-kind" hidden></p>
        <ul class="people" id="sheet-people"></ul>
        <p id="sheet-title"class="sheet-title"></p>
        <p class="sheet-desc" id="sheet-desc" hidden></p>
        <div class="materials" id="sheet-materials" hidden>
          <div class="material-links" id="sheet-links"></div>
        </div>
        <div class="marks">
          <button type="button" class="favorite" id="sheet-favorite" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.2 14.6 8.6l5.9.7-4.4 4 1.2 5.8L12 16.3 6.7 19.1l1.2-5.8-4.4-4 5.9-.7Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
            </svg>
            <span id="sheet-favorite-label">В избранное</span>
          </button>
          <button type="button" class="favorite is-secondary" id="sheet-secondary" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.75 4.5h10.5a.75.75 0 0 1 .75.75V20.1l-6-3.35-6 3.35V5.25a.75.75 0 0 1 .75-.75Z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" />
            </svg>
            <span id="sheet-secondary-label">Второй приоритет</span>
          </button>
        </div>
        <div class="sheet-actions">
          <button type="button" class="close" id="sheet-close">Закрыть</button>
          <button type="button" class="share" id="sheet-share" aria-label="Поделиться">
            <svg class="icon-share" viewBox="0 0 24 24" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="2.12">
                <path d="M8.94 10.07 15.11 6.98" />
                <path d="M8.94 13.94 15.11 17.02" />
                <circle cx="5.07" cy="12" r="3.62" />
                <circle cx="18.98" cy="5.05" r="3.62" />
                <circle cx="18.98" cy="18.95" r="3.62" />
              </g>
            </svg>
            <svg class="icon-check" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6.5 12.5 10.25 16.25 17.5 8.25" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <p class="share-status" id="sheet-share-status" role="status"></p>
      </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
