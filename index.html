<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Дизайн-выходные. Тула</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <div class="masthead">
        <div class="brand">
          <p class="kicker">Д-в.рф</p>
          <h1>Дизайн-выходные</h1>
          <p class="place">Тула · 9–10 октября</p>
        </div>
        <div class="days" id="days" role="tablist" aria-label="День"></div>
      </div>
      <div class="halls" id="halls" role="tablist" aria-label="Залы"></div>
      <p class="section" id="section"></p>
    </header>

    <div class="board" id="board" tabindex="0" aria-label="Расписание."></div>

    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet">
        <div class="grab" aria-hidden="true"></div>
        <p class="sheet-meta" id="sheet-meta"></p>
        <p class="sheet-kind" id="sheet-kind" hidden></p>
        <h2 id="sheet-title"></h2>
        <ul class="people" id="sheet-people"></ul>
        <div class="materials" id="sheet-materials" hidden>
          <p class="materials-label">Материалы</p>
          <div class="material-links" id="sheet-links"></div>
        </div>
        <button type="button" class="close" id="sheet-close">Закрыть</button>
      </div>
    </dialog>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
